[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wekeo-notebook-qa"
version = "0.1.0"
description = "Static checks and execution tests for WEkEO Jupyter notebooks"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "nbformat>=5.9",
    "nbclient>=0.10",
    "pyyaml>=6",
]

[project.optional-dependencies]
test = ["pytest>=8", "ipykernel>=6"]

[project.scripts]
wnqa = "wnqa.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
