[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "notebook-test-automation"
version = "1.0.0"
description = "Run Jupyter notebooks, label the errors and report the results, configured by profiles"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "nbformat>=5.9",
    "nbclient>=0.10",
    "pyyaml>=6",
    "jsonschema>=4",
    "ipykernel>=6",   # the default `python3` kernel must exist wherever notebook-test is installed
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
notebook-test = "notebook_test.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
notebook_test = ["profiles/*.yml", "profiles/*.json", "*.json"]
